services:
  freqtrade-fibreversalspot-eth-15m:
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade-fibreversalspot-eth-15m
    restart: unless-stopped
    volumes:
      - ./:/freqtrade
    command: >
      trade
      --config /freqtrade/user_data/config_fibreversal_eth_spot_15m.json
      --strategy FibReversalSpot_15m
      --db-url sqlite:////freqtrade/user_data/trades-fibreversalspot-eth-15m.sqlite
