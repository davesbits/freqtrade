services:
  freqtrade-openclaw-btc-sr-trend-1w:
    build:
      context: .
      dockerfile: Dockerfile
    image: freqtrade-openclaw-btc-sr-trend-1w:local
    container_name: freqtrade-openclaw-btc-sr-trend-1w
    restart: unless-stopped
    ports:
      - "8114:8114"
    volumes:
      - ./user_data:/freqtrade/user_data
    command: >
      trade
      --config /freqtrade/user_data/config_openclaw-btc-sr-trend-1w.json
      --strategy OpenClawBtcSrTrend1w
      --db-url sqlite:////freqtrade/user_data/trades-openclaw-btc-sr-trend-1w.sqlite
