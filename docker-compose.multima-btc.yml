services:
  freqtrade-multima-btc:
    image: freqtradeorg/freqtrade:stable
    restart: unless-stopped
    container_name: freqtrade-multima-btc
    volumes:
      - "./user_data:/freqtrade/user_data"
    ports:
      - "127.0.0.1:8092:8092"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade-multima-btc.log
      --db-url sqlite:////freqtrade/user_data/trades-multima-btc.sqlite
      --config /freqtrade/user_data/config_multima_btc.json
      --strategy MultiMa
