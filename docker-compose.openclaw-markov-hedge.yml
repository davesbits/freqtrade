version: '3.8'
services:
  freqtrade-openclaw-markov-hedge:
    image: freqtradeorg/freqtrade:develop
    container_name: freqtrade-openclaw-markov-hedge
    ports:
      - "8118:8118"
    volumes:
      - ./user_data:/freqtrade/user_data
    command: >
      trade
      --config /freqtrade/user_data/config_openclaw-markov-hedge.json
      --strategy OpenClawMarkovHedgeFund
      --db-url sqlite:////freqtrade/user_data/trades-openclaw-markov-hedge.sqlite
      --dry-run
    restart: unless-stopped
    stop_grace_period: 2m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
