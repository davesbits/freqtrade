services:
  freqtrade-openclaw-btc-sr-trend-15m:
    build:
      context: .
      dockerfile: Dockerfile
    image: freqtrade-local:postgres
    container_name: freqtrade-openclaw-btc-sr-trend-15m
    restart: unless-stopped
    ports:
      - "8111:8111"
    volumes:
      - ./user_data:/freqtrade/user_data
    command: >
      trade
      --config /freqtrade/user_data/config_openclaw-btc-sr-trend-15m.json
      --strategy OpenClawBtcSrTrend15m
      --db-url postgresql://bits:4642@host.docker.internal:5432/freqtrade_sr_trend_15m
