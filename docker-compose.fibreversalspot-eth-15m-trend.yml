services:
  freqtrade-fibreversalspot-eth-15m-trend:
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade-fibreversalspot-eth-15m-trend
    restart: unless-stopped
    volumes:
      - ./:/freqtrade
    command: >
      trade
      --config /freqtrade/user_data/config_fibreversal_eth_spot_15m_trend.json
      --strategy FibReversalSpot_15m_Trend
      --db-url sqlite:////freqtrade/user_data/trades-fibreversalspot-eth-15m-trend.sqlite
