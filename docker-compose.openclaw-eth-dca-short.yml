version: '3.8'
services:
  freqtrade-openclaw-eth-dca-short:
    image: freqtrade-local:postgres
    container_name: freqtrade-openclaw-eth-dca-short
    ports:
      - "8141:8141"
    volumes:
      - ./user_data:/freqtrade/user_data
    command: >
      trade
      --config /freqtrade/user_data/config_openclaw-eth-dca-short.json
      --strategy LiquidityRejectionDcaShort
      --db-url sqlite:////freqtrade/user_data/trades-openclaw-eth-dca-short.sqlite
      --dry-run
    restart: unless-stopped
    stop_grace_period: 2m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
