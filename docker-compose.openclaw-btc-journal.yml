version: '3.8'
services:
  freqtrade-openclaw-btc-journal:
    image: freqtrade-local:postgres
    container_name: freqtrade-openclaw-btc-journal
    ports:
      - "8120:8120"
    volumes:
      - ./user_data:/freqtrade/user_data
    command: >
      trade
      --config /freqtrade/user_data/config_openclaw-btc-journal.json
      --strategy OpenClawBtcJournal
      --db-url sqlite:////freqtrade/user_data/trades-openclaw-btc-journal.sqlite
      --dry-run
    restart: unless-stopped
    stop_grace_period: 2m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
