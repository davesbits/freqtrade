services:
  freqtrade-freinforced-btc-futures:
    image: freqtradeorg/freqtrade:stable
    restart: unless-stopped
    container_name: freqtrade-freinforced-btc-futures
    volumes:
      - "./user_data:/freqtrade/user_data"
    ports:
      - "127.0.0.1:8090:8090"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade-freinforced-btc-futures.log
      --db-url sqlite:////freqtrade/user_data/trades-freinforced-btc-futures.sqlite
      --config /freqtrade/user_data/config_freinforced_btc_futures.json
      --strategy FReinforcedStrategy
