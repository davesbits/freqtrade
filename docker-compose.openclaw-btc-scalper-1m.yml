services:
  freqtrade-openclaw-btc-scalper-1m:
    build:
      context: .
      dockerfile: Dockerfile
    image: freqtrade-local:postgres
    container_name: freqtrade-openclaw-btc-scalper-1m
    restart: unless-stopped
    ports:
      - "8116:8116"
    volumes:
      - ./user_data:/freqtrade/user_data
    command: >
      trade
      --config /freqtrade/user_data/config_openclaw-btc-scalper-1m.json
      --strategy OpenClawBtcScalper1m
      --db-url postgresql://bits:4642@host.docker.internal:5432/freqtrade_scalper_1m
