services:
  freqtrade-openclaw-btc-rejection-ladder-dry-test:
    build:
      context: .
      dockerfile: Dockerfile
    image: freqtrade-openclaw-btc-rejection-ladder-dry-test:local
    container_name: freqtrade-openclaw-btc-rejection-ladder-dry-test
    restart: unless-stopped
    ports:
      - "8101:8101"
    volumes:
      - ./user_data:/freqtrade/user_data
    command: >
      trade
      --config /freqtrade/user_data/config_openclaw-btc-rejection-ladder-dry-test.json
      --strategy OpenClawBtcRejectionLadderDryTest
      --db-url sqlite:////freqtrade/user_data/trades-openclaw-btc-rejection-ladder-dry-test.sqlite
