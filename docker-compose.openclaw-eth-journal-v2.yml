version: '3.8'
services:
  freqtrade-openclaw-eth-journal-v2:
    image: freqtrade-local:postgres
    container_name: freqtrade-openclaw-eth-journal-v2
    ports:
      - "8131:8131"
    volumes:
      - ./user_data:/freqtrade/user_data
    command: >
      trade
      --config /freqtrade/user_data/config_openclaw-eth-journal-v2.json
      --strategy OpenClawBtcJournalV2
      --db-url sqlite:////freqtrade/user_data/trades-openclaw-eth-journal-v2.sqlite
      --dry-run
    restart: unless-stopped
    stop_grace_period: 2m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
