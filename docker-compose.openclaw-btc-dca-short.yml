version: '3.8'
services:
  freqtrade-openclaw-btc-dca-short:
    image: freqtrade-local:postgres
    container_name: freqtrade-openclaw-btc-dca-short
    ports:
      - "8140:8140"
    volumes:
      - ./user_data:/freqtrade/user_data
    command: >
      trade
      --config /freqtrade/user_data/config_openclaw-btc-dca-short.json
      --strategy LiquidityRejectionDcaShort
      --db-url sqlite:////freqtrade/user_data/trades-openclaw-btc-dca-short.sqlite
      --dry-run
    restart: unless-stopped
    stop_grace_period: 2m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
