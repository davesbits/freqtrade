services:
  freqtrade-fibreversalspot-eth-5m:
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade-fibreversalspot-eth-5m
    restart: unless-stopped
    volumes:
      - ./:/freqtrade
    command: >
      trade
      --config /freqtrade/user_data/config_fibreversal_eth_spot_5m.json
      --strategy FibReversalSpot_5m
      --db-url sqlite:////freqtrade/user_data/trades-fibreversalspot-eth-5m.sqlite
