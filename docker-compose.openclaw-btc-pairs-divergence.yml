version: '3.8'
services:
  freqtrade-openclaw-btc-pairs-divergence:
    image: freqtrade-local:postgres
    container_name: freqtrade-openclaw-btc-pairs-divergence
    ports:
      - "8117:8117"
    volumes:
      - ./user_data:/freqtrade/user_data
    command: >
      trade
      --config /freqtrade/user_data/config_openclaw-btc-pairs-divergence.json
      --strategy OpenClawBtcPairsDivergence
      --db-url sqlite:////freqtrade/user_data/trades-openclaw-btc-pairs-divergence.sqlite
      --dry-run
    restart: unless-stopped
    stop_grace_period: 2m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
