services:
  freqtrade-openclaw-usdt-rotation:
    build:
      context: .
      dockerfile: Dockerfile
    image: freqtrade-local:postgres
    container_name: freqtrade-openclaw-usdt-rotation
    restart: unless-stopped
    ports:
      - "8122:8122"
    volumes:
      - ./user_data:/freqtrade/user_data
    command: >
      trade
      --config /freqtrade/user_data/config_usdt_rotation_live.json
      --strategy UsdtMomentumRotation
      --db-url postgresql://bits:4642@host.docker.internal:5432/freqtrade_usdt_rotation
